name: dbt CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  dbt-build-and-test:
    name: "Run dbt Models and Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dbt and Snowflake connector
        run: |
          pip install dbt-core dbt-snowflake

      - name: Run dbt deps
        run: dbt deps --project-dir dbt_ecommerce
        env:
          DBT_PROFILES_DIR: ./

      # Runs only the models that were modified in the pull request
      - name: Run dbt build (Slim CI)
        run: dbt build --select state:modified+ --project-dir dbt_ecommerce
        env:
          DBT_PROFILES_DIR: ./
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}